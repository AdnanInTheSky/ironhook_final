# .pages.yml — Pages CMS configuration for Iron Hook Boxing
# Docs: https://pagescms.org/docs/configuration/

media:
  input: images
  output: /images

content:

  # ── PROGRAMS ─────────────────────────────────────────────────────
  - name: programs
    label: Programs
    type: collection
    path: content/programs
    filename: "{fields.title}.md"

    view:
      fields:
        - title
        - schedule

    fields:
      - name: title
        label: Program Title
        type: string
        required: true

      - name: schedule
        label: Schedule
        type: string
        required: true

      - name: button_text
        label: Button Text
        type: string
        default: VIEW CLASS

      - name: button_link
        label: Button Link
        type: string
        default: /classes

      - name: body
        label: Description
        type: rich-text

  # ── SPONSORS ─────────────────────────────────────────────────────
  - name: sponsors
    label: Sponsors
    type: collection
    path: content/sponsors
    filename: "{fields.name}.md"

    view:
      fields:
        - name
        - website

    fields:
      - name: name
        label: Sponsor Name
        type: string
        required: true

      - name: logo
        label: Sponsor Logo
        type: image
        required: true

      - name: website
        label: Website
        type: string
        required: true

  # ── BLOG POSTS ───────────────────────────────────────────────────
  - name: blog
    label: Blog Posts
    type: collection
    path: content/blog
    filename: "{year}-{month}-{day}-{fields.title}.md"

    view:
      fields:
        - title
        - date
        - author
        - image

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Published Date
        type: date
        options:
          format: yyyy-MM-dd
        required: true

      - name: author
        label: Author
        type: string

      - name: image
        label: Hero Image
        type: image

      - name: excerpt
        label: Excerpt
        type: text

      - name: tags
        label: Tags
        type: list

      - name: body
        label: Content
        type: rich-text

  # ── SITE SETTINGS (optional) ─────────────────────────────────────
  - name: site
    label: Site Settings
    type: file
    path: content/site.json

    fields:
      - name: title
        label: Site Title
        type: string
        default: Iron Hook Boxing

      - name: description
        label: Meta Description
        type: text

      - name: phone
        label: Phone Number
        type: string

      - name: email
        label: Email
        type: string